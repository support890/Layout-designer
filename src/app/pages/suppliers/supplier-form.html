<div class="card">
    <div class="flex items-center mb-6">
        <p-button 
            icon="pi pi-arrow-left" 
            [text]="true"
            [rounded]="true"
            (onClick)="goBack()"
            styleClass="mr-4">
        </p-button>
        <div>
            <h2 class="text-3xl font-bold text-surface-900 dark:text-surface-0 m-0">
                {{ isEditMode ? 'Edit Supplier' : 'New Supplier' }}
            </h2>
            <p class="text-surface-600 dark:text-surface-400 mt-2">
                {{ isEditMode ? 'Modify the supplier details' : 'Create a new supplier for your products' }}
            </p>
        </div>
    </div>

    <form (ngSubmit)="onSubmit()" #supplierForm="ngForm">
        <div class="grid grid-cols-12 gap-6">
            <!-- Main Information -->
            <div class="col-span-12 lg:col-span-8">
                <p-card header="Supplier Information">
                    <div class="grid grid-cols-12 gap-4">
                        <!-- Company Name -->
                        <div class="col-span-12">
                            <label for="name" class="block mb-2 font-semibold">
                                Company Name <span class="text-red-500">*</span>
                            </label>
                            <input 
                                pInputText 
                                id="name" 
                                name="name"
                                [(ngModel)]="supplier.name" 
                                required
                                class="w-full"
                                placeholder="E.g.: Tech Solutions Inc." />
                        </div>

                        <!-- Contact Name -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="contactName" class="block mb-2 font-semibold">
                                Contact Name <span class="text-red-500">*</span>
                            </label>
                            <input 
                                pInputText 
                                id="contactName" 
                                name="contactName"
                                [(ngModel)]="supplier.contactName" 
                                required
                                class="w-full"
                                placeholder="E.g.: John Doe" />
                        </div>

                        <!-- Email -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="email" class="block mb-2 font-semibold">
                                Email <span class="text-red-500">*</span>
                            </label>
                            <input 
                                pInputText 
                                id="email" 
                                name="email"
                                type="email"
                                [(ngModel)]="supplier.email" 
                                required
                                class="w-full"
                                placeholder="contact@company.com" />
                        </div>

                        <!-- Phone -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="phone" class="block mb-2 font-semibold">
                                Phone <span class="text-red-500">*</span>
                            </label>
                            <input 
                                pInputText 
                                id="phone" 
                                name="phone"
                                [(ngModel)]="supplier.phone" 
                                required
                                class="w-full"
                                placeholder="+1 234 567 8900" />
                        </div>

                        <!-- Website -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="website" class="block mb-2 font-semibold">
                                Website
                            </label>
                            <input 
                                pInputText 
                                id="website" 
                                name="website"
                                [(ngModel)]="supplier.website" 
                                class="w-full"
                                placeholder="www.company.com" />
                        </div>

                        <!-- Address -->
                        <div class="col-span-12">
                            <label for="address" class="block mb-2 font-semibold">
                                Address
                            </label>
                            <input 
                                pInputText 
                                id="address" 
                                name="address"
                                [(ngModel)]="supplier.address" 
                                class="w-full"
                                placeholder="123 Main Street" />
                        </div>

                        <!-- City -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="city" class="block mb-2 font-semibold">
                                City
                            </label>
                            <input 
                                pInputText 
                                id="city" 
                                name="city"
                                [(ngModel)]="supplier.city" 
                                class="w-full"
                                placeholder="City" />
                        </div>

                        <!-- Country -->
                        <div class="col-span-12 md:col-span-6">
                            <label for="country" class="block mb-2 font-semibold">
                                Country
                            </label>
                            <input 
                                pInputText 
                                id="country" 
                                name="country"
                                [(ngModel)]="supplier.country" 
                                class="w-full"
                                placeholder="Country" />
                        </div>
                    </div>
                </p-card>
            </div>

            <!-- Side Panel -->
            <div class="col-span-12 lg:col-span-4">
                <p-card header="Status">
                    <div class="flex items-center">
                        <p-checkbox 
                            [(ngModel)]="supplier.active" 
                            [binary]="true"
                            inputId="active"
                            name="active">
                        </p-checkbox>
                        <label for="active" class="ml-3 cursor-pointer">
                            Active Supplier
                        </label>
                    </div>
                </p-card>

                <div class="flex flex-col gap-2 mt-4">
                    <p-button 
                        type="submit"
                        [label]="isEditMode ? 'Update Supplier' : 'Save Supplier'"
                        icon="pi pi-check"
                        styleClass="w-full"
                        severity="success">
                    </p-button>
                    <p-button 
                        type="button"
                        label="Cancel" 
                        icon="pi pi-times"
                        (onClick)="goBack()"
                        styleClass="w-full"
                        [outlined]="true">
                    </p-button>
                </div>
            </div>
        </div>
    </form>
</div>

<p-toast />
